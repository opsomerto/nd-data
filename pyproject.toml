[project]
name = "nd-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.104.0",
    "pymupdf4llm>=0.2.5",
    "pymongo>=4.17.0",
    "typer>=0.20.0",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "nd_data/tricoteuse_models.py",
    "scripts/exploration.py",
]

[tool.ruff.lint]
select = [
    "E9",
    "F821",
]

[tool.ruff.lint.per-file-ignores]
"scripts/old/*.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
